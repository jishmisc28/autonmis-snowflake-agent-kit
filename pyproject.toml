[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonmis-snowflake-agent-kit"
version = "0.1.0"
authors = [
  { name="Abhranshu Bagchi", email="abhranshu.bagchi@gmail.com" },
]
description = "Production-grade Snowflake integration layer for autonomous AI agents with connection pooling and prefix prompt cache stabilization."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/autonmis/autonmis-snowflake-agent-kit"
"Company" = "https://autonmis.com"
